services:

  mysql:
    image: mysql:8.4
    container_name: movie-mysql2
    environment:
      MYSQL_ROOT_PASSWORD: Kritter@1
      MYSQL_DATABASE: Ticker_app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  postgres:
    image: postgres:17
    container_name: movie-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: Ticker_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  tomcat:
    build:
      context: ..
      dockerfile: Movie_Ticket_Management/Dockerfile
    container_name: movie-tomcat
    ports:
       - "8080:8080"

    depends_on:
      - mysql
      - postgres

  nginx:
    image: nginx:latest
    container_name: movie_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/static:/usr/share/nginx/html/static:ro
      - /home/pc/IdeaProjects/Movie_Ticket_Management/nginx/static:/usr/share/nginx/html/static:ro
    depends_on:
      - tomcat

  localstack:
    image: localstack/localstack
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=0
    volumes:
      - "./localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

volumes:
  mysql_data:
  postgres_data: